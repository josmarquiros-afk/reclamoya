<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pago aprobado — ReclamoYA</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --azul:#0a1628; --azul-medio:#112240; --acento:#e8c547; --blanco:#f4f1eb; --gris:#8892a4; --verde:#2ecc71; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--azul); color:var(--blanco); font-family:'DM Sans',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; }
  .check { font-size:4rem; margin-bottom:16px; }
  h1 { font-family:'Playfair Display',serif; font-size:2rem; color:var(--acento); margin-bottom:10px; text-align:center; }
  p { color:var(--gris); text-align:center; margin-bottom:32px; }
  .card { background:var(--azul-medio); border:1px solid rgba(232,197,71,0.2); border-radius:20px; padding:40px; max-width:600px; width:100%; }

  .loading-container { display:flex; flex-direction:column; align-items:center; gap:16px; padding:20px 0; }
  .spinner { width:40px; height:40px; border:3px solid rgba(232,197,71,0.2); border-top-color:var(--acento); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-text { color:var(--gris); font-size:0.9rem; animation:pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:0.5}50%{opacity:1} }

  .resultado-texto { color:#c8d0dc; line-height:1.8; font-size:0.95rem; white-space:pre-wrap; }

  .acciones { display:flex; gap:12px; margin-top:24px; flex-wrap:wrap; }
  .btn { padding:12px 24px; border-radius:10px; font-family:'DM Sans',sans-serif; font-size:0.9rem; font-weight:700; cursor:pointer; border:none; transition:all 0.2s; }
  .btn-primary { background:var(--acento); color:var(--azul); }
  .btn-secondary { background:transparent; color:var(--gris); border:1px solid rgba(255,255,255,0.1) !important; }
  .btn-secondary:hover { color:var(--blanco); }
</style>
</head>
<body>
<div class="card">
  <div class="check">✅</div>
  <h1>¡Pago aprobado!</h1>
  <p>Estamos generando tu asesoría legal personalizada...</p>

  <div class="loading-container" id="loadingContainer">
    <div class="spinner"></div>
    <div class="loading-text">Analizando tu caso con la legislación argentina...</div>
  </div>

  <div class="resultado-texto" id="resultadoTexto" style="display:none"></div>

  <div class="acciones" id="acciones" style="display:none">
    <button class="btn btn-primary" onclick="descargar()">⬇ Descargar carta</button>
    <a href="/" class="btn btn-secondary">← Nueva consulta</a>
  </div>
</div>

<script>
let textoGenerado = "";

// MercadoPago devuelve los datos del pago en la URL
// Los datos del formulario se guardan en sessionStorage antes de redirigir
const params = JSON.parse(sessionStorage.getItem('reclamoya_datos') || '{}');

const PLANES = {
  basico:   { badge: "⚡ Automático" },
  estandar: { badge: "👨‍⚖️ Con revisión" },
  premium:  { badge: "⭐ Premium" },
};

const tiposLabel = {
  garantia: "garantía de producto", facturacion: "cobro indebido",
  servicio: "servicio deficiente", fraude: "publicidad engañosa",
  devolucion: "devolución rechazada", demora: "demora en entrega", otro: "reclamo"
};

async function generarRespuesta() {
  if (!params.nombre) {
    document.getElementById('loadingContainer').innerHTML = '<p style="color:#e74c3c">No se encontraron datos del formulario. <a href="/" style="color:var(--acento)">Volvé al inicio</a>.</p>';
    return;
  }

  const prompt = `Eres un asesor legal argentino experto en Defensa del Consumidor.
Un consumidor necesita orientación legal y una carta de reclamo formal.

DATOS DEL CASO:
- Nombre: ${params.nombre}
- Empresa: ${params.empresa}
- Tipo: ${tiposLabel[params.tipo] || params.tipo}
- Monto del perjuicio: $${parseFloat(params.monto).toLocaleString('es-AR')} pesos
- Descripción: ${params.descripcion}

Generá:
1. ANÁLISIS LEGAL (3-4 líneas) con artículos de la Ley 24.240 y normativas aplicables.
2. CARTA DE RECLAMO FORMAL completa lista para imprimir, con lugar/fecha, datos, hechos numerados, fundamento legal, petitorio con plazo 10 días hábiles, y firma.
3. PRÓXIMOS PASOS si la empresa no responde.

Formato: formal, profesional, directo.`;

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });

    const data = await response.json();
    textoGenerado = data.content?.map(b => b.text || "").join("\n") || "Error al generar respuesta.";

    document.getElementById('loadingContainer').style.display = 'none';
    const el = document.getElementById('resultadoTexto');
    el.textContent = textoGenerado;
    el.style.display = 'block';
    document.getElementById('acciones').style.display = 'flex';

    // Limpiamos los datos del sessionStorage
    sessionStorage.removeItem('reclamoya_datos');

  } catch (err) {
    document.getElementById('loadingContainer').innerHTML = '<p style="color:#e74c3c">Error al generar. Contactá soporte.</p>';
  }
}

function descargar() {
  const blob = new Blob([textoGenerado], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'carta-reclamo-reclamoya.txt';
  a.click();
}

generarRespuesta();
</script>
</body>
</html>
